name: Build Tweak
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          brew install ldid
      
      - name: Build Tweak
        run: |
          cd Scripts/RenRenZhuiJu
          make clean
          make package
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RenRenZhuiJu-dylib
          path: Scripts/RenRenZhuiJu/.theos/obj/debug/RenRenZhuiJu.dylib
