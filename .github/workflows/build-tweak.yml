name: Build Tweak
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Scripts/RenRenZhuiJu/**'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          brew install ldid xz
      
      - name: Build RenRenZhuiJu Tweak
        run: |
          cd Scripts/RenRenZhuiJu
          make package
      
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RenRenZhuiJuVip
          path: |
            Scripts/RenRenZhuiJu/.theos/obj/debug/*.dylib
            Scripts/RenRenZhuiJu/packages/*.deb
